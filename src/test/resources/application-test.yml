# Used by tests annotated with @ActiveProfiles("test").
# H2 in MySQL compatibility mode: no MySQL server or Docker needed.
# Flyway still runs the real migrations and Hibernate still validates against them.
spring:
  datasource:
    url: jdbc:h2:mem:shipsmart;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
